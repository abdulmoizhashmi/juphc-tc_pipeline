<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Calculator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Tax Calculator</h1>
      <p class="subtitle">Calculate progressive income tax using configurable tax brackets.</p>

      <form id="tax-form">
        <label for="income">Annual Income</label>
        <div class="input-row">
          <input id="income" name="income" type="number" min="0" step="0.01"
                 placeholder="Enter annual income" required>
          <button type="submit">Calculate Tax</button>
        </div>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <section id="result" class="result hidden">
        <div><span>Annual income</span><strong id="income-result"></strong></div>
        <div><span>Estimated tax</span><strong id="tax-result"></strong></div>
        <div><span>After-tax income</span><strong id="after-tax-result"></strong></div>
      </section>

      <section class="brackets">
        <h2>Tax Brackets</h2>
        <div id="bracket-list">Loading...</div>
      </section>

      <p class="footer">Cloud Native, DevOps, Agile and NoSQL Final Project</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
